name: Validate game data pipeline
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  validate-code:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install CI validation dependency
        run: python -m pip install -r requirements-ci.txt
      - name: Compile Python scripts
        run: python -m compileall -q scripts tests
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - name: Smoke-test query interface
        run: python scripts/query_game_data.py --dataset weapons --search whip
      - name: Smoke-test scoped combat arithmetic
        run: python scripts/combat_math.py --input examples/combat-baseline-input.json
      - name: Download source snapshots
        run: python scripts/download_sources.py
      - name: Download OSRS Wiki quest title catalogue
        run: python scripts/download_quest_catalog.py
      - name: Audit source snapshot integrity
        run: python scripts/audit_source_integrity.py
      - name: Build normalized datasets
        run: python scripts/build_dataset.py
      - name: Import extended source domains (prayers, drops, shops, slayer, NPCs, objects, models)
        run: python scripts/import_extended_sources.py
      - name: Report field-level provenance
        run: python scripts/report_field_provenance.py
      - name: Audit item IDs and name collisions
        run: python scripts/report_item_identity.py
      - name: Prioritize source conflicts
        run: python scripts/report_conflict_priorities.py
      - name: Validate generated datasets
        run: python scripts/validate_dataset.py
      - name: Audit equipment and weapon gaps
        run: python scripts/audit_equipment.py
      - name: Normalize combat data
        run: python scripts/normalize_combat_data.py
      - name: Normalize item skill requirements
        run: python scripts/build_item_requirements.py
      - name: Audit item requirement completeness and provenance
        run: python scripts/audit_item_requirement_quality.py
      - name: Evaluate example profile against known item requirements
        run: python scripts/evaluate_item_eligibility.py --profile examples/player-profile.json
      - name: Summarize item eligibility coverage and uncertainty
        run: python scripts/report_item_eligibility_coverage.py --input reports/item-eligibility.json --output reports/item-eligibility-coverage.json
      - name: Build budget-aware equipment shortlist
        run: python scripts/plan_equipment_upgrades.py --profile examples/player-profile.json --costs examples/item-costs.example.json --budget 100000000 --objective melee_strength --output reports/equipment-shortlist.json
      - name: Optimize multi-slot equipment candidate under budget
        run: python scripts/optimize_equipment_loadout.py --shortlist reports/equipment-shortlist.json --budget 100000000 --output reports/equipment-loadout-candidate.json
      - name: Audit equipment recommendation consistency
        run: python scripts/audit_equipment_recommendations.py --shortlist reports/equipment-shortlist.json --loadout reports/equipment-loadout-candidate.json --output reports/equipment-recommendation-audit.json
      - name: Report combat category coverage
        run: python scripts/report_combat_categories.py
      - name: Normalize monster combat data
        run: python scripts/normalize_monster_combat.py
      - name: Download source-backed raw quest requirement evidence
        run: python scripts/download_quest_requirement_evidence.py
      - name: Extract conservative quest skill-level text candidates
        run: python scripts/extract_quest_skill_requirement_candidates.py
      - name: Audit quest skill candidate quality and coverage
        run: python scripts/audit_quest_skill_candidates.py
      - name: Import quest fact snapshot when available
        run: python scripts/import_quests.py
      - name: Build quest prerequisite graph
        run: python scripts/build_quest_relationships.py
      - name: Build exact-match quest reward to item evidence from generated datasets
        run: python scripts/report_quest_reward_item_evidence.py --output reports/quest-reward-item-evidence.json
      - name: Audit quest fact coverage and field-level evidence
        run: python scripts/audit_quest_fact_quality.py
      - name: Report quest readiness
        run: python scripts/report_quest_readiness.py
      - name: Prioritize quest fact gaps
        run: python scripts/report_quest_gap_queue.py
      - name: Report normalized equipment and weapon provenance
        run: python scripts/report_normalized_combat_provenance.py
      - name: Report field coverage
        run: python scripts/report_coverage.py
      - name: Audit normalized combat datasets
        run: python scripts/audit_normalized_data.py
      - name: Audit combat profile, costs and effective inputs
        run: python scripts/audit_combat_inputs.py --profile examples/player-profile.json --costs examples/item-costs.example.json --inputs examples/weapon-baseline-input.json --budget 100000000
      - name: Smoke-test baseline weapon comparison
        run: python scripts/compare_weapon_baselines.py --profile examples/player-profile.json --costs examples/item-costs.example.json --inputs examples/weapon-baseline-input.json --budget 100000000 --style slash --output reports/weapon-baseline-comparison.json
      - name: Build joined item combat profiles
        run: python scripts/build_item_combat_profiles.py
      - name: Audit Combat Studio join contract and unknown-value guardrails
        run: python scripts/audit_combat_join_contract.py
      - name: Audit selected loadout compatibility using generated database only
        run: python scripts/audit_loadout_compatibility.py --selected examples/loadout-compatibility-selected.example.json --profile examples/player-profile.json --output reports/loadout-compatibility.json
      - name: Build item relationship graph
        run: python scripts/build_item_relationships.py
      - name: Audit item relationship graph joins
        run: python scripts/audit_item_relationships.py
      - name: Smoke-test caller-selected combat loadout evaluator
        run: python scripts/evaluate_combat_loadout.py --selected examples/combat-loadout-selected.example.json --costs examples/combat-loadout-costs.example.json --inputs examples/combat-loadout-inputs.example.json --budget 1000000 --style slash
      - name: Compare baseline and candidate loadout upgrade deltas
        run: python scripts/compare_loadout_upgrade_delta.py --baseline examples/loadout-upgrade-delta-baseline.example.json --candidate examples/loadout-upgrade-delta-candidate.example.json --costs examples/loadout-upgrade-delta-costs.example.json --inputs examples/combat-loadout-inputs.example.json --budget 100000000 --style slash --output reports/loadout-upgrade-delta.json
      - name: Normalize example account profile
        run: python scripts/normalize_player_profile.py --input examples/player-profile.json
      - name: Build account quest progression report
        run: python scripts/report_account_quest_progression.py --profile reports/normalized-player-profile.json
      - name: Smoke-test ranged loadout evaluator
        run: python scripts/evaluate_ranged_loadout.py --selected examples/ranged-loadout-selected.example.json --costs examples/ranged-loadout-costs.example.json --inputs examples/ranged-loadout-inputs.example.json --budget 1000000
      - name: Generate and smoke-test loadout comparison report
        run: python -c 'import json; from pathlib import Path; from scripts.compare_loadout_reports import compare_reports; a={"status":"fixture","combat_result":{"dps":1},"total_cost_gp":100}; b={"status":"fixture","combat_result":{"dps":2},"total_cost_gp":200}; r=compare_reports(a,b); assert r["delta"]["dps"] == 1; p=Path("reports/loadout-comparison.json"); p.parent.mkdir(parents=True,exist_ok=True); p.write_text(json.dumps(r,indent=2)+"\n")'
      - name: Audit baseline loadout evaluation consistency
        run: python scripts/audit_combat_loadout_evaluation.py
      - name: Audit joined item combat profile quality
        run: python scripts/audit_item_combat_profiles.py
      - name: Smoke-test joined combat profile query
        run: python scripts/query_game_data.py --dataset item-combat-profiles --id 4151
      - name: Generate database fact card for a known item ID
        run: python scripts/explain_game_fact.py --dataset item-combat-profiles --id 4151 --output reports/game-fact-card-example.json
      - name: Explore item knowledge graph from generated database
        run: python scripts/explore_item_knowledge.py --item-id 4151 --output reports/item-knowledge-explorer-example.json
      - name: Check weapon facts from the generated database only
        run: python scripts/check_weapon_from_database.py --id 4587
      - name: Report generated weapon-profile coverage
        run: python scripts/report_weapon_coverage.py
      - name: Compare weapons using generated database records only
        run: python scripts/compare_weapons_from_database.py --left 4587 --right 4151 --output reports/weapon-database-comparison.json
      - name: Audit numeric ranges and source provenance
        run: python scripts/audit_numeric_provenance.py
      - name: Build actionable database gap queue
        run: python scripts/report_database_gaps.py
      - name: Audit cross-dataset IDs and relationships
        run: python scripts/audit_database_integrity.py
      - name: Audit cross-domain combat, item and quest consistency
        run: python scripts/audit_domain_consistency.py
      - name: Build database coverage scorecard
        run: python scripts/report_database_scorecard.py
      - name: Ensure cross-domain audit report exists before schema validation
        run: python scripts/audit_domain_consistency.py --output reports/domain-consistency-audit.json
      - name: Audit cross-domain Combat Lab readiness
        run: python scripts/report_combat_lab_readiness.py
      - name: Build unified OSRS Hub readiness matrix
        run: python scripts/report_hub_readiness_matrix.py --output reports/hub-readiness-matrix.json
      - name: Validate generated datasets against JSON Schemas
        run: python scripts/validate_schemas.py
      - name: Report combat data readiness
        run: python scripts/report_combat_readiness.py
      - name: Check combat reference fixtures
        run: python scripts/check_combat_reference.py
      - name: Summarize pipeline health
        if: always()
        run: python scripts/report_pipeline_health.py
      - name: Publish generated datasets and reports
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: osrshub-game-data-${{ github.sha }}
          path: |
            dist/*.json
            reports/*.json
            sources/raw/manifest.json
            sources/raw/quest-catalog.json
            sources/raw/quest-requirement-evidence.json
            sources/raw/quest-skill-requirement-candidates.json
            reports/quest-skill-candidate-audit.json
            reports/account-quest-progression.json
            reports/game-fact-card-example.json
            reports/item-knowledge-explorer-example.json
            reports/quest-reward-item-evidence.json
          if-no-files-found: warn
          retention-days: 30
