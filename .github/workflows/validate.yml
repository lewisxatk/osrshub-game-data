name: Validate game data pipeline
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  validate-code:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install CI validation dependency
        run: python -m pip install -r requirements-ci.txt
      - name: Compile Python scripts
        run: python -m compileall -q scripts tests
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - name: Download source snapshots
        run: python scripts/download_sources.py
      - name: Download OSRS Wiki quest title catalogue
        run: python scripts/download_quest_catalog.py
      - name: Audit source snapshot integrity
        run: python scripts/audit_source_integrity.py
      - name: Build normalized datasets
        run: python scripts/build_dataset.py
      - name: Report field-level provenance
        run: python scripts/report_field_provenance.py
      - name: Audit item IDs and name collisions
        run: python scripts/report_item_identity.py
      - name: Prioritize source conflicts
        run: python scripts/report_conflict_priorities.py
      - name: Validate generated datasets
        run: python scripts/validate_dataset.py
      - name: Audit equipment and weapon gaps
        run: python scripts/audit_equipment.py
      - name: Normalize combat data
        run: python scripts/normalize_combat_data.py
      - name: Normalize item skill requirements
        run: python scripts/build_item_requirements.py
      - name: Evaluate example profile against known item requirements
        run: python scripts/evaluate_item_eligibility.py --profile examples/player-profile.json
      - name: Report combat category coverage
        run: python scripts/report_combat_categories.py
      - name: Normalize monster combat data
        run: python scripts/normalize_monster_combat.py
      - name: Build item relationship graph
        run: python scripts/build_item_relationships.py
      - name: Import quest fact snapshot when available
        run: python scripts/import_quests.py
      - name: Build quest prerequisite graph
        run: python scripts/build_quest_relationships.py
      - name: Report quest readiness
        run: python scripts/report_quest_readiness.py
      - name: Report normalized equipment and weapon provenance
        run: python scripts/report_normalized_combat_provenance.py
      - name: Report field coverage
        run: python scripts/report_coverage.py
      - name: Audit normalized combat datasets
        run: python scripts/audit_normalized_data.py
      - name: Validate generated datasets against JSON Schemas
        run: python scripts/validate_schemas.py
      - name: Report combat data readiness
        run: python scripts/report_combat_readiness.py
      - name: Check combat reference fixtures
        run: python scripts/check_combat_reference.py
      - name: Summarize pipeline health
        if: always()
        run: python scripts/report_pipeline_health.py
      - name: Publish generated datasets and reports
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: osrshub-game-data-${{ github.sha }}
          path: |
            dist/*.json
            reports/*.json
            sources/raw/manifest.json
            sources/raw/quest-catalog.json
          if-no-files-found: warn
          retention-days: 30
